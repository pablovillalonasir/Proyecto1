- name: instalar HAProxy
  apt:
    pkg: haproxy

- name: configurar HAProxy (se valida antes de aplicar)
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: "haproxy -c -f %s"
  notify:
    - reload haproxy

- name: HAProxy habilitado y arrancado
  service:
    name: haproxy
    state: started
    enabled: true

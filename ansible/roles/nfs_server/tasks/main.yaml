- name: instalar el servidor NFS
  apt:
    pkg: nfs-kernel-server

- name: crear el directorio que se exporta
  file:
    path: "{{ nfs_export }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: crear el directorio de copias de seguridad que se exporta
  file:
    path: "{{ nfs_export_backups }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: "0750"

- name: exportar los directorios (aplicación a los webs, copias a bd)
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify:
    - reexportar

- name: servidor NFS habilitado y arrancado
  service:
    name: nfs-server
    state: started
    enabled: true

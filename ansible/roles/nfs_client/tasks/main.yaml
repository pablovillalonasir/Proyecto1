- name: instalar el cliente NFS
  apt:
    pkg: nfs-common

- name: crear los puntos de montaje
  file:
    path: "{{ item.path }}"
    state: directory
  loop: "{{ nfs_montajes }}"

- name: montar los directorios compartidos del NAS (persistentes en /etc/fstab)
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ ip_nas_balanceo }}:{{ item.export }}"
    fstype: nfs
    opts: "_netdev,hard"
    state: mounted
  loop: "{{ nfs_montajes }}"

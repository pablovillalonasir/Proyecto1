# 1. lb: sistema y router NAT (los backends necesitan salir a internet a través de él)
- hosts: servidores_lb
  become: true
  roles:
    - role: commons
    - role: router

# 2. bd, webs y nas: sistema
- hosts: servidores_bd:servidores_web:servidores_nfs
  become: true
  roles:
    - role: commons

# 3. nas: servidor NFS (antes de que los webs monten su directorio)
- hosts: servidores_nfs
  become: true
  roles:
    - role: nfs_server

# 4. base de datos: MariaDB, montaje del NAS y copias de seguridad
- hosts: servidores_bd
  become: true
  roles:
    - role: bd
    - role: nfs_client
    - role: backup

# 5. servidores web: primero montan el NFS y después despliegan la aplicación
- hosts: servidores_web
  become: true
  roles:
    - role: nfs_client
    - role: web

# 6. balanceador (cuando los backends ya existen)
- hosts: servidores_lb
  become: true
  roles:
    - role: haproxy

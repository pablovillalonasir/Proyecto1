#cloud-config
hostname: web

timezone: Europe/Madrid
users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  pablo@AcerLT         # PON-AQUI-TU-CLAVE-PUBLICA

chpasswd:
  expire: False
  users:
    - name: debian
      password: debian       # Se puede cambiar por cualquier otra que queramos
      type: text

package_update: true
package_upgrade: true
